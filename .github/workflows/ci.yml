name: CI (Test, Build & Publish)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  # Job untuk Backend (Laravel)
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2.35'
        extensions: mbstring, dom, fileinfo, pdo_sqlite, pdo_pgsql, gd, curl, zip, xml, bcmath, intl
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Tests (PHPUnit)
      run: php artisan test

  # Job untuk PostgreSQL migration & FK/constraint smoke test (disposable DB)
  backend-postgres-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: yodaily_ci
          POSTGRES_USER: yodaily_ci
          POSTGRES_PASSWORD: ci_smoke_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U yodaily_ci -d yodaily_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: yodaily_ci
      DB_USERNAME: yodaily_ci
      DB_PASSWORD: ci_smoke_password

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2.35'
        extensions: mbstring, dom, fileinfo, pdo_pgsql, gd, curl, zip, xml, bcmath, intl
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Migrations (PostgreSQL)
      run: php artisan migrate --force

    - name: Verify PostgreSQL Schema & Constraints
      run: php scripts/postgres_smoke_check.php

  # Job untuk Frontend (React/Vite)
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.23.4'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Run Frontend Unit Tests
      run: npm test

    - name: Run Build
      run: npm run build

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, backend-postgres-smoke, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4

    - name: Validate frontend build configuration
      env:
        PUSH_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
        BULK_ASSIGNMENT: ${{ vars.VITE_ENABLE_BULK_ASSIGNMENT }}
        TASK_WEIGHT: ${{ vars.VITE_ENABLE_TASK_WEIGHT }}
      run: |
        test -n "$PUSH_PUBLIC_KEY" || { echo 'Missing VITE_WEB_PUSH_PUBLIC_KEY repository variable'; exit 1; }
        for value in "$BULK_ASSIGNMENT" "$TASK_WEIGHT"; do
          case "$value" in true|false) ;; *) echo 'Feature variables must be true or false'; exit 1 ;; esac
        done

    - name: Set image names
      id: images
      env:
        REPOSITORY: ${{ github.repository }}
      run: |
        echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and publish backend (also used by scheduler)
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        platforms: linux/amd64
        push: true
        tags: ${{ steps.images.outputs.prefix }}-backend:${{ steps.images.outputs.tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=backend-production
        cache-to: type=gha,mode=max,scope=backend-production

    - name: Build and publish frontend
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.images.outputs.prefix }}-frontend:${{ steps.images.outputs.tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          VITE_WEB_PUSH_PUBLIC_KEY=${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
          VITE_ENABLE_BULK_ASSIGNMENT=${{ vars.VITE_ENABLE_BULK_ASSIGNMENT }}
          VITE_ENABLE_TASK_WEIGHT=${{ vars.VITE_ENABLE_TASK_WEIGHT }}
        cache-from: type=gha,scope=frontend-production
        cache-to: type=gha,mode=max,scope=frontend-production

    - name: Promote completed release to production
      env:
        PREFIX: ${{ steps.images.outputs.prefix }}
        TAG: ${{ steps.images.outputs.tag }}
      run: |
        docker buildx imagetools create --tag "$PREFIX-backend:production" "$PREFIX-backend:$TAG"
        docker buildx imagetools create --tag "$PREFIX-frontend:production" "$PREFIX-frontend:$TAG"

    - name: Record published release
      env:
        PREFIX: ${{ steps.images.outputs.prefix }}
        TAG: ${{ steps.images.outputs.tag }}
      run: |
        printf '### Published images\n\n- `%s-backend:%s`\n- `%s-frontend:%s`\n\nBoth images are also tagged `production`. Servers can keep `IMAGE_TAG=production`; rollback tag: `%s`.\n' \
          "$PREFIX" "$TAG" "$PREFIX" "$TAG" "$TAG" >> "$GITHUB_STEP_SUMMARY"

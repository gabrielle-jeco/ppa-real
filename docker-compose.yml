services:
  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: yodaily-backend:local
    container_name: perf-app-backend
    restart: unless-stopped
    ports:
      - "8082:80"
    working_dir: /var/www
    entrypoint: ["/bin/sh", "/var/www/docker/entrypoint.sh"]
    volumes:
      - ./backend:/var/www
      - backend-vendor:/var/www/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: performance_app
      DB_USERNAME: sail
      DB_PASSWORD: password
      CACHE_DRIVER: database
      PHP_MEMORY_LIMIT: 1024M
      SANCTUM_EXPIRATION: 1440
      YOJADWAL_ENABLED: "true"
      YOJADWAL_BASE_URL: http://yojadwal.yogya.com
      YOJADWAL_LOGIN_PATH: /api/login
      YOJADWAL_PRESENCE_PATH: /api/presence
      YOJADWAL_APP_CLIENT: Android-Mobile-App
      YOJADWAL_TOKEN: ""
      YOJADWAL_COOKIE: ""
      YOJADWAL_TIMEOUT: 10
      YOJADWAL_NIK_FIELD: username
      YOJADWAL_PASSWORD_FIELD: password
      YOJADWAL_SUCCESS_FIELD: success
      YOJADWAL_ALLOW_LOCAL_SUPERADMIN_FALLBACK: "true"
      YODAILY_USER_MONITORING_PASSWORD: "${YODAILY_USER_MONITORING_PASSWORD:-admin1234}"
      WEB_PUSH_ENABLED: "${WEB_PUSH_ENABLED:-true}"
      WEB_PUSH_SUBJECT: "${WEB_PUSH_SUBJECT:-https://yodaily.yogya.co.id}"
      WEB_PUSH_PUBLIC_KEY: "${WEB_PUSH_PUBLIC_KEY:-BFaZ-aI2jbDJKARmhM62K3QmGi8JDKtfprQYizvvG0NwC2UR02YUbY9cZrjZlVp0QaaGu5KNKea_hKsmgQs_wx0}"
      WEB_PUSH_PRIVATE_KEY: "${WEB_PUSH_PRIVATE_KEY:-RyLhG5C1i9SbXQI5K7MrLYBhBMTM1pRCIIcjwn7bg-Y}"
      TZ: Asia/Jakarta
    depends_on:
      - db
    networks:
      - app-network

  # Laravel Scheduler for background reminders and Web Push notifications
  scheduler:
    image: yodaily-backend:local
    container_name: perf-app-scheduler
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        echo "memory_limit=1024M" > /usr/local/etc/php/conf.d/zz-yodaily-memory.ini
        mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache
        chown -R www-data:www-data storage bootstrap/cache || true
        chmod -R ug+rwX storage bootstrap/cache || true
        php artisan schedule:work --no-interaction
    volumes:
      - ./backend:/var/www
      - backend-vendor:/var/www/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: performance_app
      DB_USERNAME: sail
      DB_PASSWORD: password
      CACHE_DRIVER: database
      PHP_MEMORY_LIMIT: 1024M
      WEB_PUSH_ENABLED: "${WEB_PUSH_ENABLED:-true}"
      WEB_PUSH_SUBJECT: "${WEB_PUSH_SUBJECT:-https://yodaily.yogya.co.id}"
      WEB_PUSH_PUBLIC_KEY: "${WEB_PUSH_PUBLIC_KEY:-BFaZ-aI2jbDJKARmhM62K3QmGi8JDKtfprQYizvvG0NwC2UR02YUbY9cZrjZlVp0QaaGu5KNKea_hKsmgQs_wx0}"
      WEB_PUSH_PRIVATE_KEY: "${WEB_PUSH_PRIVATE_KEY:-RyLhG5C1i9SbXQI5K7MrLYBhBMTM1pRCIIcjwn7bg-Y}"
      TZ: Asia/Jakarta
    depends_on:
      - backend
    networks:
      - app-network

  # React Frontend + Nginx Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WEB_PUSH_PUBLIC_KEY: "${WEB_PUSH_PUBLIC_KEY:-BFaZ-aI2jbDJKARmhM62K3QmGi8JDKtfprQYizvvG0NwC2UR02YUbY9cZrjZlVp0QaaGu5KNKea_hKsmgQs_wx0}"
        VITE_ENABLE_BULK_ASSIGNMENT: "${VITE_ENABLE_BULK_ASSIGNMENT:-true}"
        VITE_ENABLE_TASK_WEIGHT: "${VITE_ENABLE_TASK_WEIGHT:-false}"
    container_name: perf-app-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www
    depends_on:
      - backend
    networks:
      - app-network

  # Database
  db:
    image: postgres:15
    container_name: perf-app-db
    restart: unless-stopped
    ports:
     - "5758:5432"
    environment:
      POSTGRES_DB: performance_app
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: password
      TZ: Asia/Jakarta
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  backend-vendor:

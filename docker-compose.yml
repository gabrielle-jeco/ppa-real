services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: yodaily-backend:local
    container_name: perf-app-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8082}:80"
    working_dir: /var/www
    entrypoint: ["/bin/sh", "/var/www/docker/entrypoint.sh"]
    volumes:
      - ./backend:/var/www
      - backend-vendor:/var/www/vendor
    env_file:
      - ./.env
    depends_on:
      - db
    networks:
      - app-network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: yodaily-backend:local
    container_name: perf-app-scheduler
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        echo "memory_limit=${PHP_MEMORY_LIMIT:-1024M}" > /usr/local/etc/php/conf.d/zz-yodaily-memory.ini
        mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache
        chown -R www-data:www-data storage bootstrap/cache || true
        chmod -R ug+rwX storage bootstrap/cache || true
        echo "Waiting for backend initialization..."
        until php -r '$$fp=@fsockopen("backend", 9000, $$errno, $$errstr, 1); if ($$fp) { fclose($$fp); exit(0); } exit(1);'; do
          sleep 1
        done
        echo "Backend is ready."
        php artisan schedule:work --no-interaction
    volumes:
      - ./backend:/var/www
      - backend-vendor:/var/www/vendor
    env_file:
      - ./.env
    depends_on:
      - backend
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WEB_PUSH_PUBLIC_KEY: "${VITE_WEB_PUSH_PUBLIC_KEY:-}"
        VITE_ENABLE_BULK_ASSIGNMENT: "${VITE_ENABLE_BULK_ASSIGNMENT:-true}"
        VITE_ENABLE_TASK_WEIGHT: "${VITE_ENABLE_TASK_WEIGHT:-false}"
    container_name: perf-app-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    volumes:
      - ./backend:/var/www
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:15
    container_name: perf-app-db
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-5758}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:?DB_DATABASE must be set in the root .env file}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME must be set in the root .env file}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in the root .env file}"
      TZ: "${TZ:-Asia/Jakarta}"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  backend-vendor:
